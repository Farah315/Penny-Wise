name: penny_wise
description: "Penny Wise - Track Every Penny Wisely"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_database: ^12.1.3
  firebase_auth: ^6.1.4
  google_sign_in: ^6.1.6

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # Charts
  fl_chart: ^0.65.0

  # UI
  intl: ^0.18.1

  # Network
  connectivity_plus: ^5.0.2

  # Preferences
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/penny_wise.png"
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/images/penny_wise.png"